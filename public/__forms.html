<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
  </head>
  <body>
    <!--
      This page is never linked to or rendered for visitors. It exists only
      so Netlify's build-time form scanner has a plain static HTML file to
      read: the Next.js Runtime serves app pages through its own routing
      layer, which the scanner does not reliably crawl, so forms rendered
      only inside React components can go undetected. Netlify's official
      workaround for JS-framework sites is a static form definition like
      this one, kept in sync with the real form's name and field names in
      src/components/demo/BookADemo.tsx. The live form still submits via
      fetch(); this file only handles registration.
    -->
    <form name="book-a-demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="book-a-demo" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="industry" />
      <textarea name="message"></textarea>
    </form>

    <!--
      Kweli Bot lead capture. Kept in sync with the fields submitted in
      src/lib/kweliBot/leadSubmit.ts. Same registration-only pattern as above:
      the bot submits via fetch() to /__forms.html; this definition just lets
      Netlify's scanner register the form and its fields. No database or paid
      service is involved.
    -->
    <form name="kweli-bot-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kweli-bot-lead" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="question"></textarea>
      <input type="text" name="industry" />
      <input type="text" name="role" />
      <input type="text" name="documentTypes" />
      <input type="text" name="movement" />
      <input type="text" name="checking" />
      <input type="text" name="concern" />
      <input type="text" name="volume" />
      <textarea name="conversationSummary"></textarea>
    </form>
  </body>
</html>
